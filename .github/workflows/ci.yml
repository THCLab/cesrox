name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: cesrox without the legacy format
        run: |
          cargo clippy -p cesrox --all-targets --no-default-features -- -D warnings
          cargo test -p cesrox --no-default-features

  vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Regenerate test vectors
        run: test-vectors/gen/generate.sh

      - name: Vectors match the pinned keripy revision
        run: |
          git status --porcelain -- test-vectors/v2
          test -z "$(git status --porcelain -- test-vectors/v2)"
