name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: cesrox without the legacy format
        run: |
          cargo clippy -p cesrox --all-targets --no-default-features -- -D warnings
          cargo test -p cesrox --no-default-features

  # Each crate on the rust-version it declares; said needs more than
  # cesrox because of its digest crates.
  msrv:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - rust: "1.87"
            packages: -p cesrox -p cesr-migrate
          - rust: "1.88"
            packages: -p said
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build with the minimum supported Rust version
        run: cargo check ${{ matrix.packages }} --all-features

  vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Regenerate test vectors of every generated source
        run: |
          for script in test-vectors/sources/*/generate.sh; do
            "$script"
          done

      - name: Vectors match the pinned source revisions
        run: |
          git status --porcelain -- test-vectors/v2
          test -z "$(git status --porcelain -- test-vectors/v2)"
