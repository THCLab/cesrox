[package]
name = "cesrox"
version = "2.0.0-rc.2"
edition = "2021"
description = "Implementation of Composable Event Streaming Representation (CESR)"
license = "EUPL-1.2"
keywords = ["keri", "acdc", "cesr", "encoding", "parser"]
categories = ["encoding", "parser-implementations", "cryptography"]
repository = "https://github.com/THCLab/cesrox"
rust-version = "1.87"
readme = "README.md"

[features]
default = ["legacy-v2beta"]
# Kept so builds that enable it keep working; pathed material (-P) is
# always available now.
cesr-proof = []
# Read (and optionally write) the attachment format cesrox used before
# 2.0: item counts in -K, -L, -M, -O, -S, -T and -Y and the old layout of
# current-only indexed signatures.
legacy-v2beta = []

[dependencies]
base64 = "0.23"
nom = "8"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
serde_json = "1.0"
serde_cbor = "0.11.2"
rmp-serde = "1.3.1"
anyhow = "1"

[dev-dependencies]
proptest = "1"
hex = "0.4.3"
ed25519-dalek = "3.0.0"
