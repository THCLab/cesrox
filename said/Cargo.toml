[package]
name = "said"
version = "2.0.0-beta.8"
edition = "2021"
description = "Self-Addressing identifier library"
license = "EUPL-1.2"

[features]
macros = ["sad_macros"]
file = []

[[bin]]
name = "sai"
path = "src/bin/sai.rs"
required-features = ["file"]

[dependencies]
cesrox = { path = "../cesr", version = "2.0.0-beta.8" }
blake2 = "0.11.0"
blake3 = { version = "1", default-features = false }
sha2 = "0.11.1"
sha3 = "0.12.0"
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
clap = "4.6.7"

# sad_macros = { path = "./sad_macros", optional = true }
sad_macros = { version = "0.2.0", optional = true }

serde_json = "1.0"
serde_cbor = "0.11.2"
serde_derive = "1.0.229"
rmp-serde = "1.3"
nom = "8"
indexmap = {version = "2.14.2", features= ["serde"]}

