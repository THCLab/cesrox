[package]
name = "cesrox-vectors"
version = "0.1.0"
edition = "2021"
description = "Writes the CESR V2 test vectors of the cesrox source"
license = "EUPL-1.2"
repository = "https://github.com/THCLab/cesrox"
# a generator for test-vectors/v2/cesrox, not a library
publish = false

[dependencies]
cesrox = { path = "../../../cesr", features = ["legacy-v2beta"] }
said = { path = "../../../said" }
chrono = "0.4"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
rmp-serde = "1.3"
serde_cbor = "0.11.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
